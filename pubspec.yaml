name: gitscholar
description: "GitHub-based research workspace for iPad and Android."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.10.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: ^0.20.2
  flutter_riverpod: ^3.4.3
  go_router: ^18.0.1
  http: ^1.6.0
  drift: ^2.35.0
  drift_flutter: ^0.3.1
  path_provider: ^2.1.6
  path: ^1.9.1
  flutter_secure_storage: ^11.1.1
  pdfrx: ^2.6.1
  markdown: ^7.3.1
  markdown_widget: ^2.3.2+8
  flutter_math_fork: ^0.7.4
  re_editor: ^0.10.0
  re_highlight: ^0.0.3
  webview_flutter: ^4.14.1
  url_launcher: ^6.3.2
  logger: ^2.8.0
  crypto: ^3.0.7
  collection: ^1.19.1
  uuid: ^4.6.0
  web_socket_channel: ^3.0.3
  nbformat:
    path: packages/nbformat
  text_diff:
    path: packages/text_diff
  github_api:
    path: packages/github_api
  scholar_agent:
    path: packages/scholar_agent

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.16.1
  drift_dev: ^2.35.0
  mocktail: ^1.0.5

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/
