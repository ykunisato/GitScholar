name: CI

on:
  push:
  pull_request:

jobs:
  packages:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        package: [nbformat, text_diff, github_api, scholar_agent]
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.4
      - working-directory: packages/${{ matrix.package }}
        run: |
          dart pub get
          dart format --output=none --set-exit-if-changed lib test
          dart analyze --fatal-infos
          dart test --coverage=coverage
          dart pub global activate coverage
          dart pub global run coverage:format_coverage --lcov --in=coverage --out=coverage/lcov.info --report-on=lib
      - name: Coverage >= 80%
        working-directory: packages/${{ matrix.package }}
        run: dart run ../../tool/check_coverage.dart coverage/lcov.info 80

  app:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.4
      - run: flutter pub get
      - run: dart run build_runner build --delete-conflicting-outputs
      - run: flutter gen-l10n
      - run: flutter analyze
      - run: flutter test

  build-android:
    needs: app
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.4
      - run: flutter pub get && dart run build_runner build --delete-conflicting-outputs && flutter gen-l10n
      - run: flutter build apk --debug

  build-ios:
    needs: app
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.4
      - run: flutter pub get && dart run build_runner build --delete-conflicting-outputs && flutter gen-l10n
      - run: flutter build ios --no-codesign --debug
